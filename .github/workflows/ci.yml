name: CI

# PR과 브랜치 push에서 테스트를 돌린다(배포 워크플로는 main push 전용이라 PR 회귀를 못 막음).
# ubuntu-latest에는 Docker가 있어 Testcontainers 기반 IT(#27 Flyway)도 여기서 검증된다.
on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test (Testcontainers IT 포함 — Docker 사용 가능)
        run: ./gradlew test
